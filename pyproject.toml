[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strictlimit"
version = "0.1.0"
description = "A strict-by-default token bucket rate limiter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "malcolm-builds"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
